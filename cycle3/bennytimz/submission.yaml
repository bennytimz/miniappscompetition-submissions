builder_story: "I'm a final-year pharmacy student and self-taught developer in
  Nigeria. I built Hexgrove to make staking feel less like a spreadsheet and
  more like something you tend. I verified the real flows myself: a live 200 NIM
  stake on mainnet, and the full stop-earning and withdraw cycle on testnet.
  Mainnet stop earning and withdraw are the one part I haven't been able to run
  yet, because of the 12 to 24 hour unstake wait, and I say so in the README
  rather than claim it. Since launch, Vercel Analytics (anonymous, no cookies,
  no wallet data) shows 9 visitors and 16 page views in the first day, a few of
  them from my own testing. The app is open source (MIT) and I plan to keep
  building it."
