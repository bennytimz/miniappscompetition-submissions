app_name: Kuza
category: Save
tagline: Savings goals that grow in your own NIM stake. You hold it, it earns,
  friends can chip in.
description: "Set a goal and a weekly or monthly plan; savings go into your own
  stake and earn (under 100 NIM they wait in your wallet). Kuza holds nothing.
  Friends chip in from a link that opens in Nimiq Pay. Earned is proven from the
  chain. At 100%: next goal, keep growing, or take it out."
