app_name: Kuza
category: Save
tagline: Savings goals that grow in your own NIM stake. You hold it, it earns,
  friends can chip in.
description: "Set a goal, stake toward it and watch it grow on-chain. Kuza holds
  nothing: your NIM sits in your own stake, earning while it waits. Under 100
  NIM it fills in your wallet. Friends add with a link. You can leave any time;
  a live countdown shows the real 12-24 h cooling-off."
