builder_story: "I built Counter because making something valuable should be
  enough to start selling it. Too often, an independent maker has to piece
  together a storefront, a payment method and a way to deliver their work before
  the first customer can buy.\r

  \r

  Counter brings those steps together inside Nimiq Pay. A buyer can find
  something they like, pay the maker directly, and receive it once the payment
  is verified. I started with digital products because I could make that promise
  work from beginning to end.\r

  \r

  My hope is that Counter grows into a place where more people can earn from the
  things they make - including things a neighbour could pick up. The first step
  is simple: make one honest purchase feel effortless for both sides."
