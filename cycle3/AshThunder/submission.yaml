builder_story: "I grew up on quick phone games, where most of what's called
  \"play to earn\" is really a slot machine with nicer graphics. With Nimbles I
  wanted the opposite: games where the better player always wins, with money
  moving as easily as a text message. Nimiq made that possible, because payments
  settle in seconds and the app runs inside a wallet people already have.\r

  \r

  The hardest part was keeping luck out. I dropped Ludo, Yahtzee and Bingo
  because dice decide those. I made chest rewards fixed and earned rather than
  random, and I built Settle so two players agree on the terms, winner-takes-all
  or a split, before anyone stakes. I also didn't want winnings to vanish
  straight into the next game, so I added the savings jar. You lock NIM for 7,
  30 or 90 days and earn from a pool funded by a small 2% fee on every pot.\r

  \r

  Nimbles grew from one game into 18 in a couple of weeks, then went live on
  mainnet with a signed sign-in and an escrow that pays winners automatically.
  Nimo, the little host, teaches each game and shows you your stats, so the
  first match never feels like a test."
