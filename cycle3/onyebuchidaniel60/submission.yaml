builder_story: AI agents are getting smarter, but they still lack human
  intuition. To calibrate their risk models in DeFi, they need human feedback,
  but there's no easy way for them to pay thousands of people for micro-tasks
  without gas fees. I built LevelBreak Arena to solve this. It's a fast-paced
  judgment game where users learn DeFi concepts and get paid in NIM by the
  agents they help. I also built an MCP server so AI tools like Claude can
  autonomously post bounties directly to the game.
