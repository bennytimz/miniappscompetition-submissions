builder_story: "I'm an independent developer based in Indonesia, and I built
  PayLink during Cycle 3 of the Nimiq Mini Apps Competition. I wanted to test a
  simple idea: a payment request should work like a link — something you can
  paste into a chat, print as a QR code, or put on an invoice — without a server
  in the middle. It was my first time building with the Nimiq Mini App SDK, and
  its focused surface made it practical to ship a complete flow — create, share,
  pay, track — within one cycle. PayLink is open source under the MIT license,
  and I plan to keep improving it based on feedback from users."
