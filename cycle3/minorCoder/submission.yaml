app_name: GoalJar
category: Save
tagline: Save together for trips, gifts and red packets, right inside Nimiq Pay.
description: Shared savings jars inside Nimiq Pay. Set a goal (trip, group gift,
  red packets, personal vault), share one link, friends chip in NIM with one
  tap. Progress, leaderboard and streaks are read from the Nimiq chain.
  Non-custodial, no backend, 5 languages.
