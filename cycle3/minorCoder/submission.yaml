builder_story: "In Taiwan and across Asia, we pool money all the time: a
  birthday gift for a coworker, a group trip, red packets at Lunar New Year. It
  usually lives in a messy chat thread and one person's bank app, and nobody can
  see how close we are. GoalJar makes the jar itself visible: one link, one tap
  to contribute, and a progress ring everyone trusts because it is read directly
  from the Nimiq chain. No custody and no backend, just NIM payments with a tag.
  Next: USDT (Polygon) jars, recurring \"save every Friday\" reminders, and
  printable QR posters for real-world red-packet tables."
