builder_story: "At the start of the second cycle, we asked the Nimiq team to add
  Bitcoin Lightning support for mini apps. Many projects have since started
  using it, and thanks to our request, Lightning payments are now possible in
  mini apps. We’re proud that Nimshop helped push this forward.\r

  \r

  Nimshop never holds a customer balance, so there is nothing to withdraw and
  nothing to lose.\r

  \r

  Stake. We developed Nimiq Base Staking specifically to pay these cashbacks,
  and it has reached 80 million NIM at the time of writing. Stake with it and
  your cashback rate rises from the base rate up to +10%, with a loyalty ramp
  that rewards people who stay.\r

  \r

  Review. Every order can be rated from 1 to 5 and commented on by sending a
  transaction to the blockchain, so reviews are public and permanent.\r

  \r

  Gift emails are customized for Nimiq too. When you send a gift card to someone
  outside the ecosystem, the email introduces them to Nimiq and gets them
  started."
