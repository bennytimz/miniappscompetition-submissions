builder_story: "Nimiq Pay can pay Lightning invoices with NIM or USDT, but no
  Mini App was using it. Lightning tips are how much of the Bitcoin creator
  economy gets paid, so I built a tip jar that connects the two: pick an amount,
  approve once, and the creator receives Bitcoin.\r

  \r

  I built it for real money from the start. A resolved wallet call only means
  the swap began, so the app checks the creator's Lightning backend and shows
  \"Tip delivered\" only once the invoice is actually paid. If a payment's
  outcome is unclear, it waits for settlement and never offers a retry while
  money may already have moved. Cancellations, low balances, expired invoices
  and outdated app versions each get plain-language messages that say whether
  funds moved. The server holds only a receive-only Lightning key, so it can
  never spend.\r

  \r

  Any creator can run their own copy by setting a few environment variables.
  Open source under MIT."
