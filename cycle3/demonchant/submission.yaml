builder_story: "I built Current from a problem I know well: wanting my savings
  to grow, but feeling unsure how to put them to work. Money sitting still can
  feel like money losing ground, yet earning shouldn’t mean handing over control
  or signing things you don’t understand. I created Current to make that choice
  easier to see and review: check Aave’s live USDT rate, understand each step,
  and verify what happened on Polygon. Your funds stay in your wallet until you
  approve a transaction, and the rate can change there are no guaranteed
  returns."
