tagline: Tagline Put your USDT to work, with every step in view.
description: Current is a Nimiq Pay Mini App for people who want to supply USDT
  to or withdraw it from Aave V3 on Polygon. It shows the live market rate and
  wallet position, and checks the transaction receipt and updated position
  before confirming completion.
