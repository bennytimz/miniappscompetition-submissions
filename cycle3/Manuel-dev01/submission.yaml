builder_story: "I live where crypto and everyday money don't meet easily. Rent,
  school fees and airtime get paid in naira or shillings, not USDT. Nimiq Pay
  made holding NIM and USDT simple, but getting it out still meant leaving the
  wallet for an exchange or a P2P trade with a stranger. That gap is what Ferry
  closes.\r

  \r

  I set one rule from day one: Ferry never touches the money. Funds go straight
  from your wallet to the payout partner, every payment needs your tap, and
  nothing pops up on page load.\r

  \r

  The hardest part was a wall I didn't expect. Fonbnk's form only connects
  wallets over WalletConnect, and Nimiq Pay can't do that inside Fonbnk's frame.
  So Ferry became that wallet: you copy a link, paste it, approve once, and
  Ferry hands the transaction hash back automatically.\r

  \r

  The first real payout landed in a Nigerian bank on October 28. Since then,
  real people have cashed out through Ferry, and every cash-out is public on
  Proof of Ferry."
