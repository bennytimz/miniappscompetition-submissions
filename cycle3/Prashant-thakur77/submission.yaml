app_name: Zamu
category: Save
tagline: Your chama, paid straight to M-Pesa.
description: "A chama (Kenyan rotating savings group) inside Nimiq Pay: each
  round, members pay with NIM or USDT and the shillings land straight in the
  M-Pesa of whoever's turn it is, with a receipt the whole group sees. For
  Kenyan and diaspora chamas who want to save together without trusting"
