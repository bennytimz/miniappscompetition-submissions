builder_story: Chamas are how millions of Kenyans save, but almost every one
  depends on a single treasurer holding the money. I wanted the money to go
  straight from each member to whoever's turn it is, with proof everyone can
  see. Zamu uses Nimiq Pay's payLightningInvoice to turn NIM or USDT into
  shillings in M-Pesa, signed agreements with nimiq.sign(), and a skip rule so
  nobody can take their turn and stop paying.
