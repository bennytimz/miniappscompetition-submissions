builder_story: "The Nimiq community already sends small amounts to each other
  all the time: tips for forum helpers, thanks for translators and builders,
  shares of a meetup bill. But in Nimiq Pay that means copying an address into a
  chat, with no amount and no reason. I built Pay Links so anyone can share one
  link and get paid, and so every payment can also bring a new person into Nimiq
  Pay."
