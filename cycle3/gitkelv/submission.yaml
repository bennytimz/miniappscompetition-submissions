tagline: Nimiq's community, paid with one link.
description: "Pay Links gives the Nimiq community one link for the everyday
  money it already moves: thanking a forum helper, paying a translator,
  splitting a meetup cost or backing a group project. The link opens inside
  Nimiq Pay, ready to pay in two taps. No addresses to copy and paste."
