builder_story: "I spend a lot of time on deal sites and cashback apps. The
  pattern is always the same: you get a reward, it sits in some platform’s
  account, you need to hit a minimum before you can touch it, and by the time
  you cash out the platform has already made money off your balance sitting
  there.\r

  \r

  I wanted to flip that. What if the cashback went straight into something you
  actually own, the moment the purchase was verified? No platform holding your
  money. No minimum. No mystery about whether the pot actually exists.\r

  \r

  The hardest part of cashback is trust. You don’t know if the reward will
  actually pay out until you’ve already spent the money. So I built DealJar
  around one rule: a reward is only ever promised out of money a sponsor has
  already put in, and it’s only paid after the Nimiq blockchain confirms the
  purchase. The pot balance is visible before you spend anything. If the pot is
  empty, the deal says so.\r

  \r

  The savings part came naturally. Once the cashback lands, most people just
  leave it. I added the jar so it doesn’t have to sit still. Hold it in dollars,
  move it into euros or gold, set a goal, cash out in NIM when you’re ready.\r

  \r

  Nimiq Pay made this possible without building payment infrastructure from
  scratch. The wallet handles the hard part. I just had to build something worth
  paying for."
