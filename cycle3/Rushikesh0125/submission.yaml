builder_story: "My TV started showing blue lines a few months ago. Money was
  tight, so I told myself I’d replace it next month. Four months later, the
  lines were still there, and the new TV was still on my list.\r

  \r

  I knew what I wanted to buy and roughly what it would cost. What I didn’t have
  was a plan for how much to set aside or when I’d actually have enough. So I
  built Buylist to turn “I’ll buy it next month” into a savings goal with a
  schedule and a way to see my progress.\r

  \r

  I built it into Nimiq Pay so each contribution can go directly into staking
  with the user’s approval. Buylist uses the schedule to suggest when to start
  unstaking, so the money has time to become available when it’s time to buy.
  The TV is still on my list. This time, it has a plan."
