builder_story: "Most NIM holders never stake, and every staking app looks the
  same: a balance and an APY. Payday starts somewhere else: with what you've
  already lost. It rebuilds your idle balance from your own transactions and
  shows, in NIM and your currency, what it could have earned since
  proof-of-stake launched.\r

  \r

  Then it makes staking feel like a job that pays: one-tap staking with a
  validator picked for uptime, fee and compounding; a weekly Payday reveal with
  your streak; a Stake checkup that flags a bad validator with one-tap fixes;
  and a payslip your wallet signs, which anyone can check against the live
  blockchain (tampering is detected).\r

  \r

  Your pay is meant to be spent: cash out exactly what you've earned while
  savings stay staked, pay any Lightning invoice with NIM through Nimiq Pay's
  built-in swaps, or spend in AbaPay and NimShop.\r

  \r

  Payday Circles bring the ajo/esusu tradition on-chain with no custody:
  everyone stakes their own NIM and the group watches one shared paycheck.
  There's no server; a circle lives in its link.\r

  \r

  Plus a growth planner on Nimiq's real reward curve, six two-minute lessons,
  and light and dark themes.\r

  \r

  Nimiq integration: all six staking actions, message signing and Lightning
  payments through the Mini App SDK, Nimiq Pay's remote HTLC balance, host
  network and currency, full error handling, and no backend."
