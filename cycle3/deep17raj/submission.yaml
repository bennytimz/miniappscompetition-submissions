builder_story: "I write a lot. Notes, ideas, things I’ve been learning. Most of
  it never gets shared because every platform I’ve tried feels like a bad deal.
  You write for free, hope the algorithm picks you up, and if you’re lucky you
  get a small cut months later.\r

  \r

  The writer does the work. The platform takes the value.\r

  \r

  I wanted to build something simpler. What if a reader could just pay a writer
  directly, the moment they found the article useful? No platform in the middle.
  No waiting. Just one wallet to another.\r

  \r

  That’s where NimInk started. Tips came first. Then premium unlocks,
  subscriptions and paid requests, because writers need more than one way to
  earn. Then the staking feature, which became my favourite part. You earn NIM
  from your writing, and instead of letting it sit, you can put it to work in
  one tap. The writing earns, and then the earnings earn.\r

  \r

  I built it because I wanted something I’d actually use myself."
