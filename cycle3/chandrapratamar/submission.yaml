builder_story: "I've always liked investing in gold — not as a trader, but as
  someone who wants to save a little every month and preserve value.\r

  \r

  But most platforms came with custody risks, confusing fees, or high minimums.
  So I built **Gold Pocket**.\r

  \r

  Buy PAXG directly from your phone, hold the tokens in your own wallet, and
  verify every transaction on PolygonScan.\r

  \r

  To make buying simpler, I built an aggregator that compares Li.Fi and 1inch
  quotes in parallel and automatically selects the better available route.\r

  \r

  My goal for the Save Track is simple: make tokenized gold accessible. Buy
  small amounts, track your holdings in grams or troy ounces, and see exactly
  what you paid, received, and spent on fees.\r

  \r

  **Your money. Your wallet. Your gold tokens.**"
